name: AI review

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened, edited, converted_to_draft, closed]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Existing PR number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: ai-review-${{ github.repository }}-${{ github.event.comment.id && format('comment-{0}', github.event.comment.id) || github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      vars.AI_REVIEW_ENABLED == 'true' &&
      (github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, 'review with max effort')))
    uses: MiragePrivacy/.github/.github/workflows/ai-review.yml@30a91526c81596af25690b766974ce6812cb2fc7
    with:
      automation-ref: 30a91526c81596af25690b766974ce6812cb2fc7
      pr-number: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr-number }}
      review-mode: comment
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AI_REVIEW_MEMBERS_TOKEN: ${{ secrets.AI_REVIEW_MEMBERS_TOKEN }}
