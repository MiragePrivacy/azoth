name: AI review

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened, edited, converted_to_draft, closed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Existing PR number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: true

jobs:
  review:
    if: vars.AI_REVIEW_ENABLED == 'true'
    uses: MiragePrivacy/.github/.github/workflows/ai-review.yml@3122eece6e4d61aaaf75c4c8b68d29195f75c988
    with:
      automation-ref: 3122eece6e4d61aaaf75c4c8b68d29195f75c988
      pr-number: ${{ github.event.pull_request.number || inputs.pr-number }}
      openai-model: ${{ vars.AI_REVIEW_OPENAI_MODEL || 'gpt-5.4' }}
      claude-model: ${{ vars.AI_REVIEW_CLAUDE_MODEL || 'claude-sonnet-4-6' }}
      review-mode: comment
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AI_REVIEW_MEMBERS_TOKEN: ${{ secrets.AI_REVIEW_MEMBERS_TOKEN }}
